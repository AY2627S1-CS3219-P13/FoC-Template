name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  user-service:
    name: user-service
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Generate local environment
        run: |
          sh user-service/scripts/init-env.sh
          sh credit-service/scripts/init-env.sh
      # The same command developers run locally: gofmt, go vet, go test -race, build.
      - name: Check User Service
        run: docker compose --profile test run --build --rm user-tests
