# Shared by this gateway's workers; client-supplied forwarding headers are not keys.
# Allow an initial burst of 60, then replenish at one request per second.
limit_req_zone $binary_remote_addr zone=auth_per_ip:10m rate=60r/m;

# Local HTTP only. EC2 ingress must terminate HTTPS before these private routes.
server {
    listen 8080;
    server_name _;
    client_max_body_size 16k;
    # Exclude query strings and credentials from access logs.
    access_log off;

    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 20s;
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 2s;
    set $user_backend http://user-service:8080;
    set $supplier_backend http://supplier-service:8080;
    set $credit_backend http://credit-service:8080;
    set $order_backend http://order-service:8080;
    set $frontend_backend http://frontend:3000;

    location /internal { return 404; }
    # Limiter logs include request URIs; keep them below the server log threshold.
    error_log /dev/stderr warn;
    limit_req_log_level info;
    limit_req_status 429;
    error_page 429 = @auth_rate_limited;
    location @auth_rate_limited {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "1" always;
        return 429 '{"error":{"code":"rate_limited","message":"Too many attempts. Please try again later."}}';
    }

    # Logout must remain available after authentication quota exhaustion.
    location = /api/v1/auth/logout { proxy_pass $user_backend; }
    location /api/v1/auth/ {
        limit_req zone=auth_per_ip burst=59 nodelay;
        proxy_pass $user_backend;
    }
    location = /api/v1/users/me/password {
        limit_req zone=auth_per_ip burst=59 nodelay;
        proxy_pass $user_backend;
    }
    location /api/v1/users/ { proxy_pass $user_backend; }
    location = /api/v1/admin/users { proxy_pass $user_backend; }
    location = /api/v1/admin/bootstrap-claim { proxy_pass $user_backend; }
    location = /api/v1/admin/role-events { proxy_pass $user_backend; }
    location /api/v1/admin/users/ {
        limit_req zone=auth_per_ip burst=59 nodelay;
        proxy_pass $user_backend;
    }
    location /api/v1/suppliers { proxy_pass $supplier_backend; }
    location /api/v1/wallets/ { proxy_pass $credit_backend; }
    location = /api/v1/locations { proxy_pass $supplier_backend; }
    location = /api/v1/orders {
        client_max_body_size 1m;
        proxy_pass $order_backend;
    }
    location /api/v1/orders/ {
        client_max_body_size 1m;
        # Send SSE events immediately instead of buffering the short stream.
        proxy_buffering off;
        proxy_cache off;
        proxy_pass $order_backend;
    }
    location = /orders { proxy_pass $order_backend; }
    location /orders/ { proxy_pass $order_backend; }
    location /api/ { return 404; }
    location = /healthz { return 200 "ok\n"; }
    location / { proxy_pass $frontend_backend; }
}
