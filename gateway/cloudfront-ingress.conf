# These are the two private ALB/CloudFront ENI subnets in the demo VPC.
# The EC2 security group must accept port 3000 ONLY from the ALB security group.
# Update both lists if the ingress subnet CIDRs change; never trust all sources.
set_real_ip_from 10.20.16.0/24;
set_real_ip_from 10.20.17.0/24;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Check the original connecting peer, not the client selected from the header.
geo $realip_remote_addr $foc_trusted_ingress {
    default 0;
    10.20.16.0/24 1;
    10.20.17.0/24 1;
}
